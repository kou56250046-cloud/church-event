<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>イベントの引き出し | 教会イベント企画カタログ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3FA46A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="イベント企画">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<style>
/* ===== CSS VARIABLES ===== */
:root{
  --bg:#F1FAF3;--bg-2:#E6F6EB;--card:#FFFFFF;
  --ink:#1E3328;--muted:#5C7466;--faint:#8AA294;
  --leaf:#3FA46A;--leaf-deep:#27754B;--leaf-soft:#BFE8CD;
  --mint:#DDF3E4;--mint-2:#EDF9F1;--line:#D3EBDB;
  --sun:#F5B73B;--danger:#D95A4E;
  --shadow:0 8px 28px rgba(39,117,75,.10);
  --shadow-lg:0 18px 44px rgba(39,117,75,.16);
  --r:18px;--r-sm:12px;
  --ease:cubic-bezier(.22,.85,.3,1);
}
[data-theme="dark"]{
  --bg:#0F1A14;--bg-2:#112016;--card:#182519;
  --ink:#E0F0E6;--muted:#7EA08A;--faint:#4A6A58;
  --leaf:#4EC880;--leaf-deep:#72E0A0;--leaf-soft:#1A3D28;
  --mint:#142219;--mint-2:#0E1A12;--line:#1F3526;
  --sun:#F5C752;--danger:#E56B5F;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 18px 44px rgba(0,0,0,.50);
}
[data-theme="dark"] body{
  background:
    radial-gradient(900px 420px at 85% -10%,#0A1F11 0%,transparent 60%),
    radial-gradient(700px 380px at -10% 8%,#0D2216 0%,transparent 55%),
    var(--bg);
}
[data-theme="dark"] .site-head{background:rgba(15,26,20,.88)}
[data-theme="dark"] .searchbar{background:var(--card)}
[data-theme="dark"] .modal{background:var(--card)}
[data-theme="dark"] .fg input,[data-theme="dark"] .fg select,[data-theme="dark"] .fg textarea{background:var(--mint-2)}
[data-theme="dark"] .doc-frame{filter:invert(1) hue-rotate(180deg)}

/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans JP',sans-serif;color:var(--ink);
  background:
    radial-gradient(900px 420px at 85% -10%,#DFF5E6 0%,transparent 60%),
    radial-gradient(700px 380px at -10% 8%,#E9F8EE 0%,transparent 55%),
    var(--bg);
  min-height:100vh;line-height:1.7;-webkit-font-smoothing:antialiased;
  transition:background .4s,color .3s;
}
h1,h2,h3,.brand,.btn{font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif}
a{color:var(--leaf-deep)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid rgba(63,164,106,.55);outline-offset:2px;border-radius:6px}
::selection{background:var(--leaf-soft)}

/* ===== HEADER ===== */
.site-head{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:8px;
  padding:10px clamp(12px,3vw,28px);
  background:rgba(241,250,243,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);transition:background .4s,border-color .3s;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem;letter-spacing:.02em;cursor:pointer;color:var(--leaf-deep)}
.brand .logo{display:inline-grid;place-items:center;width:32px;height:32px;background:linear-gradient(135deg,var(--leaf),#6CC992);color:#fff;border-radius:50% 50% 50% 6px;font-size:1rem;box-shadow:0 4px 12px rgba(39,117,75,.28);transition:transform .4s var(--ease)}
.brand:hover .logo{transform:rotate(-14deg) scale(1.06)}
.head-spacer{flex:1}
.head-nav{display:flex;gap:4px;align-items:center}
.head-nav-btn{font-size:.76rem;font-weight:700;padding:5px 10px;border-radius:99px;color:var(--muted);transition:all .22s var(--ease);white-space:nowrap}
.head-nav-btn:hover,.head-nav-btn.on{background:var(--mint);color:var(--leaf-deep)}
.dark-toggle{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:var(--mint);border:1.5px solid var(--line);transition:all .3s var(--ease);flex-shrink:0}
.dark-toggle:hover{transform:rotate(20deg) scale(1.1)}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.88rem;padding:8px 15px;border-radius:99px;transition:transform .25s var(--ease),box-shadow .25s,background .25s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-pri{background:linear-gradient(135deg,var(--leaf),#5BBE84);color:#fff;box-shadow:0 6px 16px rgba(39,117,75,.26)}
.btn-pri:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(39,117,75,.32)}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--leaf-deep)}
.btn-ghost:hover{background:var(--mint);transform:translateY(-2px)}
.btn-danger{background:#FBEAE8;color:var(--danger)}

/* ===== LAYOUT ===== */
main{max-width:1100px;margin:0 auto;padding:0 clamp(12px,3.5vw,28px) 80px}
.view{animation:viewIn .4s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== HERO ===== */
.hero{position:relative;padding:clamp(28px,5vw,52px) 0 8px;overflow:visible}
.hero-eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.32em;color:var(--leaf);text-transform:uppercase;margin-bottom:10px}
.hero h1{font-size:clamp(1.6rem,4.2vw,2.6rem);font-weight:900;letter-spacing:.01em;line-height:1.35}
.hero h1 em{font-style:normal;color:var(--leaf-deep);background:linear-gradient(transparent 62%,var(--leaf-soft) 62%)}
.hero-sub{color:var(--muted);margin-top:8px;font-size:.93rem}
.leaf{position:absolute;font-size:1.2rem;opacity:0;pointer-events:none;animation:drift linear infinite}
@keyframes drift{0%{opacity:0;transform:translate(0,-20px) rotate(0deg)}12%{opacity:.55}88%{opacity:.4}100%{opacity:0;transform:translate(46px,160px) rotate(160deg)}}
.searchbar{
  display:flex;align-items:center;gap:10px;margin-top:20px;
  background:var(--card);border:1.5px solid var(--line);border-radius:99px;
  padding:6px 8px 6px 18px;box-shadow:var(--shadow);max-width:540px;
  transition:box-shadow .3s,border-color .3s,transform .3s var(--ease);
}
.searchbar:focus-within{border-color:var(--leaf);box-shadow:0 10px 30px rgba(39,117,75,.18);transform:translateY(-2px)}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:1rem;min-width:0;color:var(--ink)}
.searchbar .sicon{color:var(--leaf)}
.searchbar .sclear{color:var(--faint);padding:5px 10px;border-radius:50%}
.searchbar .sclear:hover{background:var(--mint)}

/* ===== CATEGORY BANNER ===== */
.cat-banner{
  margin:14px 0 0;border-radius:var(--r);overflow:hidden;
  padding:14px 20px;display:flex;align-items:center;gap:12px;
  animation:bannerIn .4s var(--ease);
}
@keyframes bannerIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cat-banner-icon{font-size:1.9rem}
.cat-banner-name{font-size:1.05rem;font-weight:900;color:#fff}
.cat-banner-count{font-size:.8rem;color:rgba(255,255,255,.8)}

/* ===== SCHEDULE ===== */
.sched-section{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:18px;box-shadow:var(--shadow)}
.sched-section h2{font-size:.92rem;font-weight:900;color:var(--leaf-deep);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sched-list{display:flex;flex-wrap:wrap;gap:8px}
.sched-card{display:flex;align-items:center;gap:8px;background:var(--mint-2);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;cursor:pointer;transition:all .22s var(--ease)}
.sched-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--leaf)}
.sched-date{font-family:'Zen Maru Gothic';font-weight:900;font-size:.78rem;color:var(--leaf-deep);background:var(--mint);border-radius:8px;padding:3px 9px;white-space:nowrap}
.sched-days{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.sched-days.soon{background:#FFF3CD;color:#856404}
.sched-days.near{background:var(--mint);color:var(--leaf-deep)}
.sched-title{font-weight:700;font-size:.86rem}
.sched-badge{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;background:#FFF3CD;color:#856404;border:1px solid #F0DFAE}

/* ===== FAV SECTION ===== */
.fav-section{margin-top:20px}
.fav-section h2{font-size:.92rem;font-weight:900;color:var(--leaf-deep);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ===== CATEGORIES ===== */
.cats{display:flex;gap:9px;overflow-x:auto;padding:20px 2px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-tile{
  --c:var(--leaf);
  flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:11px 16px 9px;min-width:100px;
  background:var(--card);border:1.5px solid var(--line);
  border-radius:20px 20px 20px 5px;
  transition:transform .3s var(--ease),box-shadow .3s,border-color .3s,background .3s;
}
.cat-tile .ci{font-size:1.25rem;transition:transform .35s var(--ease)}
.cat-tile .cn{font-weight:700;font-size:.84rem}
.cat-tile .cc{font-size:.68rem;color:var(--faint);font-weight:700}
.cat-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--c)}
.cat-tile:hover .ci{transform:rotate(-10deg) scale(1.15)}
.cat-tile.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--c) 38%,transparent)}
.cat-tile.on .cc{color:rgba(255,255,255,.85)}

/* ===== FILTERS ===== */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:4px 0 8px}
.f-label{font-size:.72rem;font-weight:700;color:var(--faint);margin-right:-2px}
.chip{font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);color:var(--muted);transition:all .22s var(--ease)}
.chip:hover{border-color:var(--leaf);color:var(--leaf-deep);transform:translateY(-2px)}
.chip.on{background:var(--leaf-deep);border-color:var(--leaf-deep);color:#fff}
.f-sep{width:1px;height:16px;background:var(--line);margin:0 2px}
.f-clear{font-size:.76rem;font-weight:700;color:var(--faint);text-decoration:underline;padding:3px 5px}
.f-clear:hover{color:var(--danger)}
.result-meta{font-size:.82rem;color:var(--muted);padding:8px 2px 4px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.result-meta b{color:var(--leaf-deep);font-size:.98rem}
.vm-btns{display:inline-flex;background:var(--mint-2);border:1.5px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.vm-btns button{font-size:.76rem;font-weight:700;padding:4px 11px;border-radius:99px;color:var(--muted);transition:all .2s var(--ease)}
.vm-btns button.on{background:var(--card);color:var(--leaf-deep);box-shadow:0 2px 8px rgba(39,117,75,.12)}

/* ===== CARDS (FLIP) ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(272px,100%),1fr));gap:15px}
.card{
  --c:var(--leaf);
  position:relative;min-height:310px;
  perspective:900px;cursor:pointer;
}
.card-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .58s var(--ease);
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r) var(--r) var(--r) 6px;
  padding:17px 17px 13px;overflow:hidden;
}
.card-front::before,.card-back::before{
  content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 45%,#fff));
  transform:scaleX(.32);transform-origin:left;transition:transform .45s var(--ease);
}
.card:hover .card-front::before{transform:scaleX(1)}
.card.flipped .card-back::before{transform:scaleX(1)}
.card-back{
  transform:rotateY(180deg);
  display:flex;flex-direction:column;gap:9px;
}
/* star */
.star-btn{
  position:absolute;top:10px;right:10px;z-index:5;
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-size:.95rem;
  background:var(--card);border:1.5px solid var(--line);
  transition:all .22s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.star-btn:hover{transform:scale(1.15);border-color:var(--sun)}
.star-btn.on{background:#FFF8E6;border-color:var(--sun)}
/* card content */
.card-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
.cat-chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.hist-chip{font-size:.68rem;font-weight:700;color:var(--faint)}
.hist-chip.has{color:var(--leaf-deep);background:var(--mint);padding:2px 8px;border-radius:99px}
.card-front h3{font-size:1.05rem;font-weight:900;letter-spacing:.01em;margin-bottom:4px;padding-right:30px}
.card-front .sum{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.badge{font-size:.7rem;font-weight:700;color:var(--muted);background:var(--mint-2);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.7rem;color:var(--leaf-deep);font-weight:500}
.doc-mark{position:absolute;right:12px;bottom:10px;font-size:.66rem;font-weight:700;color:var(--sun)}
/* back */
.card-back-title{font-size:.98rem;font-weight:900;color:var(--ink);padding-right:34px}
.card-back-sum{font-size:.8rem;color:var(--muted);line-height:1.6;flex:1;overflow:auto}
.card-back-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.flip-hint{font-size:.68rem;color:var(--faint)}
/* card img */
.card-img{margin:-17px -17px 11px;border-radius:calc(var(--r) - 1.5px) calc(var(--r) - 1.5px) 0 0;overflow:hidden;height:128px;background:var(--mint)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.card-front:hover .card-img img{transform:scale(1.06)}
.ref-link-btn{position:absolute;right:12px;bottom:34px;font-size:.72rem;padding:2px 6px;border-radius:6px;color:var(--leaf-deep);background:var(--mint);border:1px solid var(--line);z-index:2;transition:background .2s,transform .2s}
.ref-link-btn:hover{background:var(--leaf-soft);transform:scale(1.1)}
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--muted);background:var(--mint-2);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:2rem;margin-bottom:8px}


/* ===== TABLE VIEW ===== */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.ev-table{width:100%;border-collapse:collapse;font-size:.84rem}
.ev-table th{background:var(--mint);color:var(--leaf-deep);font-weight:700;padding:9px 13px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.ev-table th:hover{background:var(--leaf-soft)}
.ev-table th .sa::after{content:"⇅";color:var(--faint);margin-left:4px;font-size:.72rem}
.ev-table th.asc .sa::after{content:"▲"}
.ev-table th.desc .sa::after{content:"▼"}
.ev-table td{padding:9px 13px;border-top:1px solid var(--line);vertical-align:middle}
.ev-table tr:hover td{background:var(--mint-2);cursor:pointer}
.td-title{font-weight:700;color:var(--leaf-deep)}
.td-badge{display:inline-block;font-size:.68rem;font-weight:700;color:var(--muted);background:var(--mint-2);border:1px solid var(--line);padding:1px 6px;border-radius:99px}

/* ===== DASHBOARD ===== */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px;margin-bottom:20px}
.stat-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat-card .sv{font-size:2rem;font-weight:900;color:var(--leaf-deep);font-family:'Zen Maru Gothic'}
.stat-card .sl{font-size:.78rem;color:var(--muted);margin-top:3px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.chart-card h3{font-size:.9rem;font-weight:900;color:var(--leaf-deep);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.chart-card h3::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,var(--line),transparent)}

/* ===== MATRIX ===== */
.matrix-wrap{overflow-x:auto;margin-top:4px}
.matrix-grid{display:grid;grid-template-columns:90px repeat(5,1fr);gap:5px;min-width:520px}
.mh{font-size:.76rem;font-weight:700;color:var(--leaf-deep);background:var(--mint);border-radius:9px;padding:7px 9px;text-align:center}
.mrh{font-size:.74rem;font-weight:700;color:var(--leaf-deep);background:var(--mint);border-radius:9px;padding:7px 9px;display:flex;align-items:center}
.mcell{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:7px;min-height:76px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background .2s}
.mcell:hover{background:var(--mint-2)}
.mcell-count{font-size:.66rem;font-weight:700;color:var(--faint)}
.mcell-item{font-size:.68rem;font-weight:700;background:var(--mint);color:var(--leaf-deep);border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .18s}
.mcell-item:hover{background:var(--leaf-soft)}
.mcell-empty{font-size:.68rem;color:var(--faint)}

/* ===== ANIMATIONS ===== */
.stagger>*{opacity:0;animation:floatUp .52s var(--ease) forwards;animation-delay:calc(var(--i,0)*50ms)}
@keyframes floatUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.reveal.on{opacity:1;transform:none}

/* ===== DETAIL ===== */
.backrow{padding:18px 0 12px}
.backlink{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.86rem;color:var(--leaf-deep);padding:5px 10px;border-radius:99px;transition:all .22s var(--ease)}
.backlink:hover{background:var(--mint);transform:translateX(-3px)}
.d-head{--c:var(--leaf);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,var(--card)),var(--card) 65%);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:clamp(16px,3.4vw,28px);box-shadow:var(--shadow)}
.d-head h1{font-size:clamp(1.3rem,3.4vw,1.9rem);font-weight:900;margin:8px 0 5px}
.d-head .sum{color:var(--muted);font-size:.92rem}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.d-section{margin-top:24px}
.d-section>h2{display:flex;align-items:center;gap:7px;font-size:1rem;font-weight:900;color:var(--leaf-deep);margin-bottom:11px}
.d-section>h2::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,var(--line),transparent)}
.doc-frame-wrap{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.doc-frame{display:block;width:100%;min-height:300px;border:none;background:#fff}
.md-body{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:clamp(16px,3.5vw,32px);box-shadow:var(--shadow)}
.md-body h1{font-size:1.45rem;color:var(--leaf-deep);border-bottom:2.5px solid var(--mint);padding-bottom:7px;margin:.4em 0 .7em}
.md-body h2{font-size:1.15rem;color:var(--leaf-deep);margin:1.3em 0 .5em;padding-left:9px;border-left:4px solid var(--leaf)}
.md-body h3{font-size:1rem;margin:1.1em 0 .4em}
.md-body p{margin:.5em 0}
.md-body ul,.md-body ol{padding-left:1.5em;margin:.5em 0}
.md-body li{margin:.2em 0}
.md-body table{border-collapse:collapse;width:100%;margin:.9em 0;font-size:.88rem}
.md-body th{background:var(--mint);color:var(--leaf-deep);font-weight:700}
.md-body th,.md-body td{border:1px solid var(--line);padding:7px 11px;text-align:left}
.md-body tr:nth-child(even) td{background:var(--mint-2)}
.md-body blockquote{border-left:4px solid var(--sun);background:#FFFBEF;padding:7px 13px;border-radius:0 9px 9px 0;color:#7A6326;margin:.8em 0}
.md-body code{background:var(--mint-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.85em}
.md-body hr{border:none;border-top:1.5px dashed var(--line);margin:1.3em 0}
.doc-empty{text-align:center;padding:40px 20px;background:var(--mint-2);border:1.5px dashed var(--leaf-soft);border-radius:var(--r);color:var(--muted)}
.doc-empty .big{font-size:1.8rem;margin-bottom:7px}
.prompt-box{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:14px auto 9px;max-width:620px;font-size:.8rem;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.h-list{display:flex;flex-direction:column;gap:9px}
.h-item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;transition:transform .22s var(--ease),box-shadow .22s}
.h-item:hover{transform:translateX(4px);box-shadow:var(--shadow)}
.h-date{flex:0 0 auto;font-family:'Zen Maru Gothic';font-weight:900;color:var(--leaf-deep);background:var(--mint);border-radius:9px;padding:4px 10px;font-size:.8rem}
.h-memo{flex:1;font-size:.86rem;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.h-del{color:var(--faint);font-size:.78rem;padding:3px 7px;border-radius:7px}
.h-del:hover{color:var(--danger);background:#FBEAE8}

/* ===== FORM ===== */
.form-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:clamp(16px,3.2vw,28px);box-shadow:var(--shadow);margin-top:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:.78rem;font-weight:700;color:var(--leaf-deep)}
.fg label .req{color:var(--danger);margin-left:3px}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--mint-2);transition:border-color .22s,background .22s,box-shadow .22s;width:100%;color:var(--ink)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--leaf);background:var(--card);box-shadow:0 0 0 4px rgba(63,164,106,.14)}
.fg textarea{resize:vertical;min-height:200px;font-family:ui-monospace,monospace;font-size:.82rem;line-height:1.55}
.fg .hint{font-size:.7rem;color:var(--faint)}
.check-row{display:flex;flex-wrap:wrap;gap:7px}
.seg{display:inline-flex;background:var(--mint-2);border:1.5px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{font-size:.76rem;font-weight:700;padding:5px 13px;border-radius:99px;color:var(--muted);transition:all .22s var(--ease)}
.seg button.on{background:var(--card);color:var(--leaf-deep);box-shadow:0 2px 8px rgba(39,117,75,.13)}
.form-foot{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1.5px dashed var(--line)}

/* ===== MODAL / TOAST ===== */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(30,51,40,.4);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadeIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:20px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:24px clamp(16px,3.5vw,28px);box-shadow:0 30px 80px rgba(20,40,30,.32);animation:popIn .4s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{font-size:1.15rem;font-weight:900;color:var(--leaf-deep);display:flex;align-items:center;gap:7px;margin-bottom:5px}
.modal .desc{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.modal .fg{margin-bottom:12px}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.note{font-size:.74rem;color:var(--muted);background:var(--mint-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;margin-top:12px;line-height:1.6}
#toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:.84rem;font-weight:500;padding:10px 18px;border-radius:99px;box-shadow:0 12px 28px rgba(20,40,30,.28);animation:toastIn .38s var(--ease);max-width:88vw}
.toast.ok{background:var(--leaf-deep)}
.toast.err{background:var(--danger)}
.toast.out{animation:toastOut .32s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(9px) scale(.96)}}
.banner-info{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#FFF8E6;border:1.5px solid #F0DFAE;color:#8A6D1C;border-radius:var(--r-sm);padding:9px 13px;font-size:.8rem;margin-top:14px}
.welcome{max-width:600px;margin:8vh auto 0;text-align:center}
.welcome .logo-big{font-size:3rem;animation:sway 3.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.welcome h1{font-size:1.55rem;font-weight:900;margin:13px 0 7px}
.welcome p{color:var(--muted);font-size:.9rem}
.spin{display:inline-block;width:40px;height:40px;border:4px solid var(--mint);border-top-color:var(--leaf);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;padding:16vh 0;gap:12px;color:var(--muted);font-size:.86rem}
.d-hero-img-wrap{margin-bottom:18px}
.d-hero-img{width:100%;max-height:270px;object-fit:cover;border-radius:var(--r)}
.ref-link-wrap{margin-top:4px}
.ref-link-card{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 16px;text-decoration:none;color:var(--ink);transition:box-shadow .22s,transform .22s,border-color .22s;max-width:100%;word-break:break-all}
.ref-link-card:hover{border-color:var(--leaf);box-shadow:var(--shadow);transform:translateY(-2px);color:var(--leaf-deep)}
.ref-link-text{font-size:.86rem;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-link-arrow{font-size:.88rem;color:var(--faint);flex-shrink:0}

@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .chart-grid{grid-template-columns:1fr}
  .head-nav-btn span{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .stagger>*,.reveal{opacity:1!important;transform:none!important}
  .card-inner{transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="site-head">
  <div class="brand" id="brand" role="button" tabindex="0" aria-label="ホームへ">
    <span class="logo">🌿</span><span>イベントの引き出し</span>
  </div>
  <div class="head-spacer"></div>
  <nav class="head-nav">
    <button class="head-nav-btn" id="nav-home">🏠 <span>ホーム</span></button>
    <button class="head-nav-btn" id="nav-dash">📊 <span>統計</span></button>
    <button class="head-nav-btn" id="nav-matrix">🗂 <span>マトリックス</span></button>
  </nav>
  <button class="dark-toggle" id="dark-toggle" aria-label="ダークモード切り替え" title="ダークモード切り替え">🌙</button>
</header>

<main id="app">
  <div class="loading"><span class="spin"></span>データを読み込んでいます…</div>
</main>

<div id="modal-root"></div>
<div id="toast-wrap"></div>

<script>
"use strict";

const SEASONS = ["春","夏","秋","冬","通年"];
const BUDGETS = {free:"無料",low:"〜500円/人",mid:"〜1,500円/人",high:"1,500円〜/人"};
const PEOPLE_FILTERS = {s:"〜10人",m:"10〜30人",l:"30人〜"};
const STAR_KEY = "church-events-stars";
const DARK_KEY = "church-events-dark";
const CHART_COLORS = ["#3FA46A","#2D7DD2","#8B5CF6","#DC2626","#F59E0B","#EC4899","#06B6D4","#10B981"];

const state = {
  data: null,
  filters: {q:"",category:null,people:null,seasons:new Set(),budgets:new Set()},
  stars: new Set(),
  viewMode: "card",
  tableSort: {col:"title",dir:"asc"},
};

/* ===== UTILS ===== */
const $ = s => document.querySelector(s);
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function detectFormat(t){
  const s=String(t||"").trim();
  if(!s) return "markdown";
  if(/^</.test(s)||/<\/?(html|body|head|style|div|section|table|h[1-6]|p|ul|ol)\b/i.test(s)) return "html";
  return "markdown";
}
function catOf(id){ return (state.data?.categories||[]).find(c=>c.id===id)||{id:"",name:"未分類",icon:"📁",color:"#9AAFA1"}; }
function peopleLabel(ev){
  const a=ev.peopleMin,b=ev.peopleMax;
  if(a==null&&b==null) return null;
  if(a!=null&&b!=null) return `${a}〜${b}人`;
  if(a!=null) return `${a}人〜`;
  return `〜${b}人`;
}
function toast(msg,type="ok",ms=2500){
  const el=document.createElement("div");
  el.className="toast "+type;el.textContent=msg;
  $("#toast-wrap").appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),340);},ms);
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const diff=new Date(dateStr)-new Date(new Date().toDateString());
  return Math.ceil(diff/86400000);
}
function fmtDate(s){
  if(!s) return "";
  const d=new Date(s);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

/* ===== STARS ===== */
function loadStars(){
  try{state.stars=new Set(JSON.parse(localStorage.getItem(STAR_KEY)||"[]"));}
  catch(e){state.stars=new Set();}
}
function saveStars(){localStorage.setItem(STAR_KEY,JSON.stringify([...state.stars]));}
function toggleStar(id,e){
  if(e){e.stopPropagation();}
  state.stars.has(id)?state.stars.delete(id):state.stars.add(id);
  saveStars();
  document.querySelectorAll(`.star-btn[data-id="${id}"]`).forEach(btn=>{
    const on=state.stars.has(id);
    btn.classList.toggle("on",on);
    btn.textContent=on?"★":"☆";
    btn.title=on?"お気に入りから外す":"お気に入りに追加";
  });
}

/* ===== DARK MODE ===== */
function initDarkMode(){
  const saved=localStorage.getItem(DARK_KEY);
  const prefersDark=window.matchMedia("(prefers-color-scheme:dark)").matches;
  applyDark(saved!==null?saved==="1":prefersDark,false);
}
function applyDark(dark,save=true){
  document.documentElement.dataset.theme=dark?"dark":"light";
  const btn=$("#dark-toggle");
  if(btn)btn.textContent=dark?"☀️":"🌙";
  if(save)localStorage.setItem(DARK_KEY,dark?"1":"0");
}
function toggleDark(){applyDark(document.documentElement.dataset.theme!=="dark");}

/* ===== DATA ===== */
async function loadData(){
  try{
    const res=await fetch("data/events.json?t="+Date.now(),{cache:"no-store"});
    if(res.ok){state.data=normalize(await res.json());return;}
  }catch(e){}
  state.data=null;
}
function normalize(d){
  d=d||{};
  d.version=d.version||1;
  d.categories=Array.isArray(d.categories)?d.categories:[];
  d.events=Array.isArray(d.events)?d.events:[];
  d.events.forEach(ev=>{
    ev.history=Array.isArray(ev.history)?ev.history:[];
    ev.tags=Array.isArray(ev.tags)?ev.tags:[];
    ev.seasons=Array.isArray(ev.seasons)?ev.seasons:[];
  });
  return d;
}

/* ===== FILTERING ===== */
function filteredEvents(){
  const f=state.filters;
  const terms=f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return (state.data.events||[]).filter(ev=>{
    if(f.category&&ev.category!==f.category) return false;
    if(f.people){
      const min=ev.peopleMin??0,max=ev.peopleMax??9999;
      if(f.people==="s"&&min>10) return false;
      if(f.people==="m"&&(max<10||min>30)) return false;
      if(f.people==="l"&&max<30) return false;
    }
    if(f.seasons.size){
      const evs=ev.seasons||[];
      if(!evs.includes("通年")&&![...f.seasons].some(s=>evs.includes(s))) return false;
    }
    if(f.budgets.size&&!f.budgets.has(ev.budget)) return false;
    if(terms.length){
      const hay=[ev.title,ev.summary,(ev.tags||[]).join(" "),ev.detail||"",catOf(ev.category).name].join(" ").toLowerCase();
      if(!terms.every(t=>hay.includes(t))) return false;
    }
    return true;
  });
}
function activeFilterCount(){
  const f=state.filters;
  return (f.category?1:0)+(f.people?1:0)+f.seasons.size+f.budgets.size+(f.q.trim()?1:0);
}

/* ===== SCHEDULE ===== */
function getScheduled(){
  return (state.data?.events||[])
    .filter(ev=>ev.nextScheduledAt)
    .map(ev=>({ev,days:daysUntil(ev.nextScheduledAt)}))
    .filter(({days})=>days!=null&&days>=0&&days<=90)
    .sort((a,b)=>a.days-b.days);
}

/* ===== REVEAL ===== */
const app=$("#app");
let revObs=null;
function setupReveal(){
  if(revObs)revObs.disconnect();
  revObs=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");revObs.unobserve(e.target);}});
  },{rootMargin:"0px 0px -8% 0px",threshold:.06});
  document.querySelectorAll(".reveal").forEach(el=>revObs.observe(el));
}

/* ===== CARD HTML ===== */
function cardHtml(ev,i){
  const c=catOf(ev.category);
  const ppl=peopleLabel(ev);
  const isStar=state.stars.has(ev.id);
  const days=daysUntil(ev.nextScheduledAt);
  const hasSched=days!=null&&days>=0&&days<=90;
  const schedLabel=days===0?"今日！":`あと${days}日`;
  return `
<article class="card reveal" data-id="${esc(ev.id)}" style="--c:${esc(c.color)};transition-delay:${Math.min(i,8)*38}ms" tabindex="0" role="button" aria-label="${esc(ev.title)}">
  <div class="card-inner">
    <div class="card-front">
      <button class="star-btn ${isStar?"on":""}" data-id="${esc(ev.id)}" title="${isStar?"お気に入りから外す":"お気に入りに追加"}">${isStar?"★":"☆"}</button>
      ${ev.imageUrl?`<div class="card-img"><img src="${esc(ev.imageUrl)}" alt="${esc(ev.title)}" loading="lazy" onerror="this.parentElement.remove()"></div>`:""}
      <div class="card-top">
        <span class="cat-chip">${esc(c.icon)} ${esc(c.name)}</span>
        <span class="hist-chip ${ev.history.length?"has":""}">${ev.history.length?`📅 ${ev.history.length}回`:"未開催"}</span>
      </div>
      <h3>${esc(ev.title)}</h3>
      <p class="sum">${esc(ev.summary||"")}</p>
      <div class="badges">
        ${ppl?`<span class="badge">👥 ${esc(ppl)}</span>`:""}
        ${(ev.seasons||[]).map(s=>`<span class="badge">${esc(s)}</span>`).join("")}
        ${ev.budget?`<span class="badge">💰 ${esc(BUDGETS[ev.budget]||ev.budget)}</span>`:""}
        ${hasSched?`<span class="sched-badge">📅 ${esc(schedLabel)}</span>`:""}
      </div>
      ${ev.detail?`<span class="doc-mark">📄 企画書あり</span>`:""}
    </div>
    <div class="card-back" style="--c:${esc(c.color)}">
      <button class="star-btn ${isStar?"on":""}" data-id="${esc(ev.id)}" title="${isStar?"お気に入りから外す":"お気に入りに追加"}">${isStar?"★":"☆"}</button>
      <div class="card-back-title">${esc(ev.title)}</div>
      <p class="card-back-sum">${esc(ev.summary||"")}</p>
      ${(ev.tags||[]).length?`<div class="tagrow">${ev.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>`:""}
      ${hasSched?`<div class="sched-badge">📅 ${esc(fmtDate(ev.nextScheduledAt))} (${esc(schedLabel)})</div>`:""}
      <div class="card-back-footer">
        <span class="flip-hint">タップで戻る</span>
        <button class="btn btn-pri" style="font-size:.78rem;padding:6px 13px" data-goto="${esc(ev.id)}">詳細を見る →</button>
      </div>
    </div>
  </div>
</article>`;
}

/* ===== HOME ===== */
function renderHome(){
  if(!state.data){
    app.innerHTML=`<div class="empty" style="margin-top:60px"><div class="big">🌿</div>データを読み込めませんでした。<br>ページを再読み込みしてください。</div>`;
    return;
  }
  const f=state.filters;
  const cats=state.data.categories;
  const countBy={};
  state.data.events.forEach(ev=>{countBy[ev.category]=(countBy[ev.category]||0)+1;});
  const activeCat=f.category?cats.find(c=>c.id===f.category):null;

  const bannerHtml=activeCat?`
<div class="cat-banner" style="background:linear-gradient(135deg,${esc(activeCat.color)},color-mix(in srgb,${esc(activeCat.color)} 60%,#1a4a2a))">
  <span class="cat-banner-icon">${esc(activeCat.icon)}</span>
  <div><div class="cat-banner-name">${esc(activeCat.name)}</div><div class="cat-banner-count">${countBy[activeCat.id]||0}件</div></div>
</div>`:"";

  const scheduled=getScheduled();
  const schedHtml=scheduled.length?`
<div class="sched-section reveal">
  <h2>📅 近日予定のイベント</h2>
  <div class="sched-list">
    ${scheduled.map(({ev,days})=>`
      <div class="sched-card" data-go="${esc(ev.id)}">
        <span class="sched-date">${esc(fmtDate(ev.nextScheduledAt))}</span>
        <span class="sched-days ${days<=7?"soon":"near"}">${days===0?"今日！":`あと${days}日`}</span>
        <span class="sched-title">${esc(ev.title)}</span>
      </div>`).join("")}
  </div>
</div>`:"";

  const favEvs=[...state.stars].map(id=>state.data.events.find(e=>e.id===id)).filter(Boolean);

  const leaves=Array.from({length:6},(_,i)=>{
    const left=8+i*16+Math.random()*6,dur=11+Math.random()*7,delay=i*1.7;
    return `<span class="leaf" style="left:${left}%;top:${Math.random()*30}%;animation-duration:${dur}s;animation-delay:${delay}s">${i%2?"🍃":"🌿"}</span>`;
  }).join("");

  app.innerHTML=`
<div class="view">
  <section class="hero">
    ${leaves}
    <p class="hero-eyebrow">Church Event Catalog</p>
    <h1>つぎの集まり、<em>なにをしよう?</em></h1>
    <p class="hero-sub">カテゴリーを選んで、種目を決めるだけ。企画書も、開催の記録も、ぜんぶここに。</p>
    <div class="searchbar">
      <span class="sicon">🔍</span>
      <input id="q" type="search" placeholder="キーワードで探す(例:子ども 夏)" value="${esc(f.q)}" autocomplete="off">
      <button class="sclear" id="q-clear" aria-label="検索クリア" ${f.q?"":"hidden"}>✕</button>
    </div>
  </section>

  ${bannerHtml}
  ${schedHtml}

  ${favEvs.length&&!f.category&&!f.q.trim()?`
  <div class="fav-section">
    <h2>★ お気に入り</h2>
    <div class="grid" id="fav-grid">${favEvs.map((ev,i)=>cardHtml(ev,i)).join("")}</div>
  </div>`:""}

  <nav class="cats stagger" aria-label="カテゴリー">
    <button class="cat-tile ${!f.category?"on":""}" data-cat="" style="--i:0">
      <span class="ci">🌈</span><span class="cn">すべて</span><span class="cc">${state.data.events.length}件</span>
    </button>
    ${cats.map((c,i)=>`

/* ===== GRID ===== */
function renderGrid(){
  const area=$("#grid-area");if(!area)return;
  const list=filteredEvents();
  const rc=$("#result-count");
  if(rc)rc.innerHTML=`<b>${list.length}</b> 件`+(activeFilterCount()?"（絞り込み中）":"");

  if(!list.length){
    area.innerHTML=`<div class="grid"><div class="empty"><div class="big">🌱</div>条件に合うイベントが見つかりません。<br>条件をゆるめてみましょう。</div></div>`;

  if(state.viewMode==="table"){

  }
  area.innerHTML=`<div class="grid">${list.map((ev,i)=>cardHtml(ev,i)).join("")}</div>`;

function setupCardGrid(container){
  container.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click",e=>{
      if(e.target.closest(".star-btn")||e.target.closest("[data-goto]")) return;
      el.classList.toggle("flipped");
    });
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();el.classList.toggle("flipped");}
    });
  });
  container.querySelectorAll("[data-goto]").forEach(btn=>{
    btn.addEventListener("click",e=>{e.stopPropagation();location.hash="#/event/"+btn.dataset.goto;});
  });
  container.querySelectorAll(".star-btn").forEach(btn=>{
    btn.addEventListener("click",e=>toggleStar(btn.dataset.id,e));
  });
}


/* ===== TABLE VIEW ===== */
function buildTableHtml(list){
  const s=state.tableSort;
  const sorted=[...list].sort((a,b)=>{
    let av,bv;
    if(s.col==="title"){av=a.title||"";bv=b.title||"";}
    else if(s.col==="cat"){av=catOf(a.category).name;bv=catOf(b.category).name;}
    else if(s.col==="people"){av=a.peopleMax??9999;bv=b.peopleMax??9999;}
    else if(s.col==="budget"){const o={free:0,low:1,mid:2,high:3};av=o[a.budget]??9;bv=o[b.budget]??9;}
    else if(s.col==="history"){av=a.history.length;bv=b.history.length;}
    else{av=a.title||"";bv=b.title||"";}
    if(typeof av==="string")return s.dir==="asc"?av.localeCompare(bv,"ja"):bv.localeCompare(av,"ja");
    return s.dir==="asc"?av-bv:bv-av;
  });
  const th=(col,lbl)=>`<th data-col="${col}" class="${s.col===col?s.dir:""}">${lbl}<span class="sa"></span></th>`;
  return `
<div class="table-wrap">
  <table class="ev-table">
    <thead><tr>${th("title","タイトル")}${th("cat","カテゴリー")}${th("people","人数")}${th("budget","予算")}${th("history","開催数")}</tr></thead>
    <tbody>
      ${sorted.map(ev=>{
        const c=catOf(ev.category),ppl=peopleLabel(ev),s2=state.stars.has(ev.id);
        return `<tr data-id="${esc(ev.id)}">
          <td><span class="td-title">${s2?"★ ":""}${esc(ev.title)}</span><br><span style="font-size:.74rem;color:var(--muted)">${esc((ev.summary||"").slice(0,42))}…</span></td>
          <td><span class="cat-chip" style="--c:${esc(c.color)}">${esc(c.icon)} ${esc(c.name)}</span></td>
          <td>${ppl?`<span class="td-badge">👥 ${esc(ppl)}</span>`:"−"}</td>
          <td>${ev.budget?`<span class="td-badge">💰 ${esc(BUDGETS[ev.budget])}</span>`:"−"}</td>
          <td>${ev.history.length?`<span class="td-badge">📅 ${ev.history.length}回</span>`:"未開催"}</td>
        </tr>`;
      }).join("")}
    </tbody>
  </table>
</div>`;
}
function setupTable(list){
  const area=$("#grid-area");if(!area)return;
  area.querySelectorAll(".ev-table th[data-col]").forEach(th=>{
    th.addEventListener("click",()=>{
      const col=th.dataset.col;
      if(state.tableSort.col===col)state.tableSort.dir=state.tableSort.dir==="asc"?"desc":"asc";
      else{state.tableSort.col=col;state.tableSort.dir="asc";}
      area.innerHTML=buildTableHtml(list);setupTable(list);
    });
  });
  area.querySelectorAll(".ev-table tbody tr[data-id]").forEach(tr=>{
    tr.addEventListener("click",()=>{location.hash="#/event/"+tr.dataset.id;});
  });
}

function drawBar(id,labels,values,colors,tc){
  const cv=document.getElementById(id);if(!cv)return;
  const ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  const W=cv.offsetWidth,H=200;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const p={t:10,r:10,b:46,l:32};
  const cw=W-p.l-p.r,ch=H-p.t-p.b;
  const max=Math.max(...values,1);
  const n=labels.length;
  ctx.clearRect(0,0,W,H);
  ctx.font=`11px 'Noto Sans JP',sans-serif`;ctx.textAlign="center";
  labels.forEach((lbl,i)=>{
    const bw=(cw/n)*0.68,gap=(cw/n)*0.32;
    const x=p.l+i*(cw/n)+gap/2;
    const bh=(values[i]/max)*ch,y=p.t+ch-bh;
    ctx.fillStyle=colors[i%colors.length]||"#3FA46A";
    roundRect(ctx,x,y,bw,bh,4);
    if(values[i]>0){ctx.fillStyle=tc;ctx.fillText(values[i],x+bw/2,y-2);}
    ctx.fillStyle=tc;
    const s=lbl.length>5?lbl.slice(0,4)+"…":lbl;
    ctx.fillText(s,x+bw/2,p.t+ch+16);
  });
}
function drawHBar(id,labels,values,barColor,tc){
  const cv=document.getElementById(id);if(!cv)return;
  const ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  const W=cv.offsetWidth,H=200;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const p={t:6,r:32,b:6,l:110};
  const cw=W-p.l-p.r,ch=H-p.t-p.b;
  const n=Math.max(labels.length,1),rh=ch/n;
  const max=Math.max(...values,1);
  ctx.clearRect(0,0,W,H);
  ctx.font=`11px 'Noto Sans JP',sans-serif`;
  labels.forEach((lbl,i)=>{
    const y=p.t+i*rh+rh*0.18,bh=rh*0.6,bw=(values[i]/max)*cw;
    ctx.fillStyle=barColor;
    roundRect(ctx,p.l,y,bw,bh,3);
    ctx.fillStyle=tc;ctx.textAlign="right";
    ctx.fillText(lbl.length>9?lbl.slice(0,8)+"…":lbl,p.l-5,y+bh/2+4);
    ctx.textAlign="left";
    if(values[i]>0)ctx.fillText(values[i],p.l+bw+4,y+bh/2+4);
  });
}
function roundRect(ctx,x,y,w,h,r){
  if(h<=0){ctx.fillRect(x,y,w,1);return;}
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();ctx.fill();
}

/* ===== ROUTER ===== */
function updateNav(active){
  document.querySelectorAll(".head-nav-btn").forEach(b=>b.classList.remove("on"));
  const el=document.getElementById(active);if(el)el.classList.add("on");
}
function route(){
  const h=location.hash;let m;
  if((m=h.match(/^#\/event\/(.+)$/))){ updateNav("nav-home");renderDetail(decodeURIComponent(m[1])); }
  else if(h==="#/dashboard"){ updateNav("nav-dash");renderDashboard(); }
  else if(h==="#/matrix"){ updateNav("nav-matrix");renderMatrix(); }
  else{ updateNav("nav-home");renderHome(); }
}

$("#brand").addEventListener("click",()=>{state.filters={q:"",category:null,people:null,seasons:new Set(),budgets:new Set()};location.hash="";route();});
$("#brand").addEventListener("keydown",e=>{if(e.key==="Enter"){location.hash="";route();}});
$("#nav-home").addEventListener("click",()=>{state.filters={q:"",category:null,people:null,seasons:new Set(),budgets:new Set()};location.hash="";});
$("#nav-dash").addEventListener("click",()=>{location.hash="#/dashboard";});
$("#nav-matrix").addEventListener("click",()=>{location.hash="#/matrix";});

async function boot(){
  initDarkMode();
  loadStars();
  app.innerHTML=`<div class="loading"><span class="spin"></span>データを読み込んでいます…</div>`;
  await loadData();
  route();
}
boot();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});
}
</script>
